name: Stormlord

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou versão exata
        default: main
        required: true
        type: string

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: smooth-seas-forge-no-sailors/.github/.github/workflows/stormlord.yml@ca356d0b0719ab613059ab2f4e5d3f7ecf7b5456
    with:
      sistema: stormlord-site
      publicar: ${{ github.event_name == 'workflow_dispatch' }}
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    secrets: inherit
