name: Stormlord

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: stormlord-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verificar o código
        run: docker build --target ci --tag stormlord-ci-stormlord-site:${{ github.sha }} .

  publicar:
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    uses: smooth-seas-forge-no-sailors/.github/.github/workflows/stormlord.yml@d7bb36f7d511d72122cc5de1171e66da0a4ff585
    with:
      sistema: stormlord-site
      imagens: >-
        [{"nome":"app","imagem":"ghcr.io/smooth-seas-forge-no-sailors/stormlord-site","contexto":".","dockerfile":"Dockerfile","variavel_teste":"STORMLORD_IMAGEM_TESTE","variavel_deploy":"STORMLORD_IMAGEM"}]
      arquivos_configuracao: '["deploy/stormlord.json","deploy/stormlord.compose.yml","deploy/stormlord.caddy"]'
    secrets: inherit
