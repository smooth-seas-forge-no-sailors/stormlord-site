<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stormlord</title>
  <meta name="description" content="Smooth seas forge no sailors.">
  <meta property="og:title" content="Stormlord">
  <meta property="og:description" content="Hell is empty and all the devils are here.">
  <meta property="og:image" content="https://stormlord.dev.br/stormlord-logo.png">
  <meta name="theme-color" content="#621639">
  <link rel="icon" href="stormlord-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@500;800&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --crimson-12: #621639; --crimson-8: #e093b2; --slate-1: #fcfcfd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--crimson-12); color: var(--slate-1); }
    body { min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 48px 16px; font-family: "Spectral", Georgia, serif; text-align: center; }
    main { width: 100%; max-width: 640px; overflow-wrap: break-word; }
    img { width: min(380px, 80vw); height: auto; display: block; margin: 0 auto 40px; }
    blockquote { margin: 0; font-style: italic; font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1.3; }
    cite { display: block; margin-top: 12px; font-style: normal; font-size: .95rem; color: var(--crimson-8); letter-spacing: .04em; }
    p { margin: 36px 0 0; font-family: "Karla", system-ui, sans-serif; font-weight: 800; font-size: clamp(.9rem, 2.4vw, 1.05rem); letter-spacing: .14em; text-transform: uppercase; line-height: 1.9; }
    a { color: var(--slate-1); }
    footer { margin-top: 48px; font-family: "Karla", system-ui, sans-serif; font-weight: 500; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <img src="stormlord-logo.svg" alt="Stormlord — Smooth seas forge no sailors">
    <blockquote>“Hell is empty and all the devils are here.”<cite>William Shakespeare, The Tempest</cite></blockquote>
    <p>Lead or bleed, stay lethal and unfuck yourself.<br>No smooth seas forged a skilled sailor.</p>
    <footer><a href="https://github.com/smooth-seas-forge-no-sailors">github.com/smooth-seas-forge-no-sailors</a></footer>
  </main>
</body>
</html>
